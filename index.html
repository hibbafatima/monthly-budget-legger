<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ledger</title>
<style>
:root{
  --bg:#f2f4f3; --card:#ffffff; --ink:#14201d; --muted:#6a7672; --line:#e5e9e7; --chip:#eceeed; --soft:#e4f2ed;
  --accent:#0f7a63; --accent-ink:#ffffff; --neg:#c23b4a; --pos:#0f7a63; --warn:#b26b0c; --track:#e8ecea;
  --grad:linear-gradient(140deg,#0b5a4b 0%,#10806a 52%,#21a886 100%);
  --tint:.13;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 4px 16px rgba(20,32,29,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0f0e; --card:#161c1a; --ink:#e8eeeb; --muted:#8c9a95; --line:#232b28; --chip:#1f2724; --soft:#12302a;
    --accent:#43c9a4; --accent-ink:#04221b; --neg:#f2808d; --pos:#4fd1aa; --warn:#e9ad52; --track:#232b28;
    --grad:linear-gradient(140deg,#0a3f35 0%,#0e5f4e 52%,#158066 100%);
    --tint:.2; --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .dim{color:var(--muted)}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hello span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hello h1{margin:0;font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.actions{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}
.pill{border:0;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--pos)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--neg)}
.pill.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

main{padding:4px 16px calc(112px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}

.hero{background:var(--grad);color:#fff;border-radius:24px;padding:16px 18px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(11,90,75,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.per{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.arrows{display:flex;gap:6px}
.hero .arrows button{border:0;background:rgba(255,255,255,.16);color:#fff;width:32px;height:32px;border-radius:50%;font-size:17px}
.arrows button:disabled{opacity:.35}
.hero .lbl{margin-top:14px;font-size:14px;opacity:.85;position:relative;z-index:1}
.hero .amt{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.05;position:relative;z-index:1}
.hero .amt small{font-size:22px;font-weight:700;opacity:.8;margin-right:4px}
.hero .pace{font-size:14px;opacity:.92;margin-top:4px;position:relative;z-index:1}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.hchip{background:rgba(255,255,255,.15);border-radius:12px;padding:7px 10px;font-size:12.5px;line-height:1.25}
.hchip b{display:block;font-size:15px}
.hchip.bad{background:rgba(255,120,120,.3)}

.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flush{padding:6px 0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card.flush .card-h{padding:10px 16px 0;margin-bottom:4px}
.card-h h2,.card>h2{margin:0;font-size:17px;font-weight:700}
.card>h2{margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:15px}
.empty{color:var(--muted);margin:4px 0;font-size:15px}
.card.flush .empty{padding:4px 16px 12px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.sub-h{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:500}

.ico{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:20px;background:hsl(var(--h) 70% 50% / var(--tint))}
.ico.sm{width:32px;height:32px;border-radius:10px;font-size:16px}

.row{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:0;background:none;padding:10px 16px}
.row:active,.tap:active{background:var(--chip)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-r{font-weight:700;white-space:nowrap;text-align:right}
.amt-r small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.day-h{font-size:12px;color:var(--muted);padding:12px 16px 2px;display:flex;justify-content:space-between;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.chev{color:var(--muted);font-size:18px;margin-left:2px}

.crow{display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:none;width:100%;text-align:left}
.crow .row-main{display:flex;flex-direction:column;gap:5px}
.crow .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.crow .top b{font-weight:700}
.crow .meta{font-size:12.5px;color:var(--muted)}
.bar-track{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent)}
.bar-fill.warn-f{background:var(--warn)} .bar-fill.neg-f{background:var(--neg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}
.qchip{display:flex;align-items:center;gap:8px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 12px 8px 8px;text-align:left}
.qchip b{display:block;font-size:14px;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip small{font-size:12px;color:var(--muted)}
.qchip.new{background:var(--accent);color:var(--accent-ink);padding:8px 14px;font-weight:650}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:650;font-size:16px;background:var(--chip);margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--line)}
.pay{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}
.paid{color:var(--pos);font-weight:600;font-size:14px}

.alert{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:#fff4e2;color:#6b4300;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
@media (prefers-color-scheme: dark){.alert{background:#3a2a10;color:#f3d29b}}
.alert b{display:block;font-size:15px}

.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.cols{display:grid;gap:6px;align-items:end}
.col{text-align:center;border:0;background:none;padding:0}
.col-area{height:110px;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.col-bar{width:62%;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.col-bar.inc,.col-bar.mute{background:var(--track)}
.col-v{font-size:11px;color:var(--muted);height:16px;white-space:nowrap}
.col-l{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px}
.col.cur .col-l{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin:0 0 10px;box-shadow:var(--shadow)}
.search svg{width:19px;height:19px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;outline:none;-webkit-appearance:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .addbtn{flex:none;width:58px;height:58px;margin:-22px 6px 0;border-radius:20px;background:var(--grad);color:#fff;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 20px rgba(11,90,75,.35)}

.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(8,16,14,.45)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-width:640px;margin:0 auto}
.sheet-panel.entry{display:flex;flex-direction:column;overflow:hidden;height:94%;padding-bottom:0}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet-panel{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;flex:none}
.sheet-head h3{margin:0;font-size:18px;font-weight:700;text-align:center;flex:1}
.sheet-head>*:first-child,.sheet-head>*:last-child{min-width:56px}
.sheet-head>*:last-child{text-align:right}
.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px}
.amount-in{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding:4px 2px 6px;margin-bottom:16px}
.amount-in span{font-size:22px;font-weight:700;color:var(--muted)}
.amount-in input{flex:1;min-width:0;border:0;background:none;font-size:36px;font-weight:800;padding:0;outline:none}

.e-scroll{flex:1;overflow:auto;margin:0 -16px;padding:0 16px 10px}
.e-amt{text-align:center;padding:2px 0 10px}
.e-amt .v{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.e-amt .v small{font-size:22px;color:var(--muted);font-weight:700;margin-right:4px}
.e-amt .v.empty-v{color:var(--muted)}
.e-amt .h{font-size:13px;color:var(--muted);min-height:18px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cat{border:0;background:var(--card);border-radius:14px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow)}
.cat .ico{width:34px;height:34px;font-size:18px;border-radius:11px}
.cat.on{outline:2px solid var(--accent);color:var(--ink);font-weight:650}
.sugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px}
.more-t{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 0 10px}
.keypad{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 16px 6px;border-top:1px solid var(--line);margin:0 -16px;background:var(--bg)}
.keypad button{border:0;background:var(--card);border-radius:12px;height:46px;font-size:22px;font-weight:600;box-shadow:var(--shadow)}
.keypad button:active{background:var(--chip)}
.keypad .save{grid-column:1/-1;height:52px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;margin-top:2px}
.e-foot{flex:none;height:calc(8px + env(safe-area-inset-bottom,0px))}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.loan-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.loan-p,.fixed-row,.rem{padding:11px 0;border-bottom:1px solid var(--line)}
.loan-p:last-of-type,.fixed-row:last-of-type,.rem:last-of-type{border-bottom:0}
.fixed-row{display:flex;align-items:center;gap:12px}
.rem-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rem .row-title,.loan-p .row-title{white-space:normal}
.tap{cursor:pointer;border-radius:10px}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.twin .card{margin:0;padding:14px}
.twin span{font-size:13px;color:var(--muted)}
.twin b{display:block;font-size:20px;font-weight:750;margin:2px 0}
</style>
</head>
<body>
<header class="top">
  <div class="hello"><span id="hello"></span><h1 id="title">Ledger</h1></div>
  <div class="actions">
    <button id="syncPill" class="pill" data-open="settings"><i></i><span>Sheet</span></button>
    <button class="iconbtn" data-opensheet aria-label="Open Google Sheet">📗</button>
    <button class="iconbtn" data-open="settings" aria-label="Settings">⚙️</button>
  </div>
</header>
<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Activity</button>
  <button class="addbtn" id="fab" aria-label="Add an entry">+</button>
  <button data-tab="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Money</button>
</nav>

<div class="sheet" id="sheet"><div class="sheet-bg" data-close></div><div class="sheet-panel" id="sheetBody"></div></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
/* =================== Data =================== */
const KEY = 'hibba-ledger-v1', SYNC = 'hibba-ledger-sync';
const METHODS = ['Cash','HBL card','Meezan card','Faysal credit card','SadaPay card','Standard Chartered card','Account transfer'];
const CATS = ['Grocery','Eat-out','Car','Medical','Fixed monthly','Kids','Shopping','Bills','Charity','Other'];
const CAT_META = {Grocery:['🛒',140],'Eat-out':['🍽️',18],Car:['🚗',210],Medical:['💊',350],'Fixed monthly':['📅',262],Kids:['🧒',42],Shopping:['🛍️',300],Bills:['💡',50],Charity:['🤲',170],Other:['📦',200]};
const TYPE_META = {income:['💼',150],save_in:['🏦',190],save_out:['🏦',190],lent:['🤝',30],lent_back:['🤝',150],borrowed:['🤝',355],borrowed_back:['🤝',355]};
const METHOD_ICO = m => m === 'Cash' ? '💵' : m === 'Account transfer' ? '🔁' : m ? '💳' : '❔';
const PLACES = ['Mutual funds','Bank accounts','Stocks','Cash','With Mama'];
const GROUPS = {expense:'Expense', income:'Income', savings:'Savings', loan:'Loan'};
const TYPE_LABEL = {expense:'Expense', income:'Income', save_in:'Put in', save_out:'Took out', lent:'I lent', lent_back:'Got back', borrowed:'I borrowed', borrowed_back:'I paid back'};
const KNOWN = [[/tehzeeb|bread|bakery|vegetable|sabzi|fruit|mutton|chicken|meat|milk|prema|grocer|mart|imtiaz|carrefour|al.?fatah|metro/i,'Grocery'],[/eggspectation|savour|kfc|mcdonald|karahi|cafe|coffee|restaurant|pizza|burger|biryani|dine|lunch|dinner|chai|tea\b/i,'Eat-out'],[/fuel|petrol|shell|pso|tyre|tire|car wash|parking|toll|mechanic|careem|uber|indrive|bykea/i,'Car'],[/doctor|medicine|pharmacy|clinic|hospital|lab|dentist/i,'Medical'],[/school|football|toy|kids|mustafa|abdullah|tuition|uniform/i,'Kids'],[/electric|gas bill|water bill|internet|bill\b|ptcl|k-?electric|iesco|sngpl/i,'Bills'],[/zakat|sadqa|sadaqah|charity|donation|khairat/i,'Charity'],[/clothes|dress|shoe|lulu|khaadi|sapphire|gul ahmed|amazon|daraz|mall/i,'Shopping']];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO = () => isoOf(new Date());
const monthOf = iso => (iso||'').slice(0,7);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => 'Rs ' + Math.round(Math.abs(n)).toLocaleString('en-US');
const rsS = n => (Math.round(n) < 0 ? '−' : '') + rs(n);

/* =================== Google Sheet sync =================== */
const blankSync = () => ({url:'', key:'', sheetUrl:'', outbox:[], deleted:[], stateDirty:false, lastSync:0, error:''});
let sync = (() => { try { return Object.assign(blankSync(), JSON.parse(localStorage.getItem(SYNC)) || {}); } catch(e){ return blankSync(); } })();
let syncBusy = false, syncTimer = null;
const saveSync = () => { try { localStorage.setItem(SYNC, JSON.stringify(sync)); } catch(e){} };
const connected = () => !!(sync.url && sync.key);
function markDirty(id){ if (!sync.outbox.includes(id)) sync.outbox.push(id); saveSync(); }
function markDeleted(id){ sync.outbox = sync.outbox.filter(x => x !== id); if (!sync.deleted.includes(id)) sync.deleted.push(id); saveSync(); }
function touchState(){ db.stateUpdated = Date.now(); sync.stateDirty = true; saveSync(); }
function queueSync(ms = 1200){ if (!connected()) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), ms); }
async function call(body){
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const res = body
      ? await fetch(sync.url, {method:'POST', body: JSON.stringify(Object.assign({key: sync.key}, body)), signal: ctrl.signal})
      : await fetch(sync.url + (sync.url.includes('?') ? '&' : '?') + 'action=pull&key=' + encodeURIComponent(sync.key), {signal: ctrl.signal});
    let j; try { j = await res.json(); } catch(e){ throw new Error('The link didn’t answer like the Ledger script. Check the web app link and that access is set to Anyone.'); }
    if (!j.ok) throw new Error(j.error || 'The sheet refused the request');
    if (j.url) sync.sheetUrl = j.url;
    return j;
  } finally { clearTimeout(t); }
}
async function syncNow(pull = true, loud = false){
  if (!connected() || syncBusy) return;
  if (!navigator.onLine){ paintSync(); return; }
  syncBusy = true; paintSync();
  try {
    const ids = [...sync.outbox], dels = [...sync.deleted], stateSent = sync.stateDirty;
    if (ids.length || dels.length || stateSent){
      const body = {upserts: ids.map(id => db.entries.find(e => e.id === id)).filter(Boolean), deletes: dels};
      if (stateSent) body.state = {fixed: db.fixed, reminders: db.reminders, budgets: db.budgets, kids: db.kids || null, seededV4: !!db.seededV4, updated: db.stateUpdated || Date.now()};
      await call(body);
      sync.outbox = sync.outbox.filter(id => !ids.includes(id));
      sync.deleted = sync.deleted.filter(id => !dels.includes(id));
      if (stateSent) sync.stateDirty = false;
    }
    let n = 0;
    if (pull){ const j = await call(null); n = mergeFromSheet(j); }
    sync.lastSync = Date.now(); sync.error = '';
    if (loud) toast(ids.length > 5 ? `Uploaded ${ids.length} entries to your sheet ✓` : n ? `${n} change${n > 1 ? 's' : ''} from the sheet` : 'Synced with your sheet ✓');
  } catch(err){
    sync.error = err.name === 'AbortError' ? 'The sheet took too long to answer' : (err.message === 'Failed to fetch' || err.message === 'Load failed' ? 'Couldn’t reach the sheet' : err.message);
    if (loud) toast('Sync failed: ' + sync.error);
  }
  syncBusy = false; saveSync(); paintSync();
  if (!sync.error && (sync.outbox.length || sync.deleted.length || sync.stateDirty)) queueSync(800);
}
function clean(r){
  const e = {};
  for (const [k,v] of Object.entries(r)){ if (v === '' || v === null || v === false || k === 'deleted' || k === 'kind') continue; e[k] = v; }
  ['amount','bill','covered','created','updated'].forEach(k => { if (e[k] != null) e[k] = Number(e[k]); });
  if (e.bill == null){ delete e.covered; delete e.coveredBy; }
  if (!e.type) e.type = 'expense';
  return e;
}
function mergeFromSheet(j){
  let n = 0; const pending = new Set(sync.outbox), gone = new Set(sync.deleted);
  for (const r of j.entries || []){
    if (!r.id || !r.date) continue;
    const i = db.entries.findIndex(e => e.id === r.id);
    if (r.deleted){ if (i >= 0 && !pending.has(r.id)){ db.entries.splice(i,1); n++; } continue; }
    if (gone.has(r.id) || pending.has(r.id)) continue;
    const e = clean(r);
    if (i < 0){ db.entries.push(e); n++; }
    else if ((e.updated || 0) > (db.entries[i].updated || db.entries[i].created || 0)){ db.entries[i] = e; n++; }
  }
  const s = j.state;
  if (s && !sync.stateDirty && (s.updated || 0) > (db.stateUpdated || 0)){
    if (Array.isArray(s.fixed)) db.fixed = s.fixed;
    if (Array.isArray(s.reminders)) db.reminders = s.reminders;
    if (s.budgets) db.budgets = s.budgets;
    if (s.kids) db.kids = s.kids;
    if (s.seededV4) db.seededV4 = true;
    db.stateUpdated = s.updated; n++;
  }
  if (n){ save(); if (!sheetMode) render(); }
  return n;
}
function paintSync(){
  const p = $('#syncPill'), t = p.querySelector('span');
  const waiting = sync.outbox.length + sync.deleted.length + (sync.stateDirty ? 1 : 0);
  p.className = 'pill';
  if (!connected()){ t.textContent = 'Connect sheet'; return; }
  if (syncBusy){ p.classList.add('busy'); t.textContent = 'Syncing…'; return; }
  if (sync.error){ p.classList.add('err'); t.textContent = 'Sync failed'; return; }
  if (waiting){ p.classList.add('wait'); t.textContent = navigator.onLine ? waiting + ' to sync' : 'Offline · ' + waiting; return; }
  p.classList.add('ok'); t.textContent = 'Synced';
}

  const es = db.entries.filter(e => inR(e, r));

const paidIn = (f, m) => db.entries.some(e => e.fixedId === f.id && monthOf(e.date) === m);
const isDue = (f, m) => f.every === 2 ? !paidIn(f, shiftMonth(m,-1)) : true;
function projection(r, spent, es){
  const t = todayISO(); let total, elapsed;
  if (r.kind === 'month' && r.month === t.slice(0,7)){ total = +lastDay(r.month).slice(8); elapsed = +t.slice(8); }
  else if (r.kind === 'salary'){ total = 30; elapsed = daysBetween(r.from, t) + 1; if (elapsed > 30) return null; }
  else return null;
  if (elapsed < 3) return null;
  const fixedSpent = sum(es.filter(e => e.type === 'expense' && e.category === 'Fixed monthly'));
  let unpaid = 0; if (r.kind === 'month') unpaid = db.fixed.filter(f => isDue(f, r.month) && !paidIn(f, r.month)).reduce((a,f) => a + (+f.amount || 0), 0);
  return Math.round(fixedSpent + (spent - fixedSpent) / elapsed * total + unpaid);
}
function placeBalances(){
  const b = {};
  const add = (place, excl, v) => { const k = place + '|' + (excl ? 1 : 0); (b[k] = b[k] || {place, excl: !!excl, amt: 0}).amt += v; };
  for (const e of db.entries){
    if (e.type === 'save_in'){ add(e.place || 'Other', e.exclude, +e.amount); if (e.moveFrom) add(e.moveFrom, e.exclude, -e.amount); }
    if (e.type === 'save_out') add(e.place || 'Other', e.exclude, -e.amount);
    if (e.type === 'borrowed_back' && samePerson(e.person, KIDS_PERSON)) add(KIDS_MAMA, true, +e.amount);
  }
  return Object.values(b);
}

}
function groupBy(arr, fn){ const m = {}; for (const e of arr){ const k = fn(e); (m[k] = m[k] || []).push(e); } return Object.entries(m).map(([k,v]) => ({k, items:v, total:sum(v)})).sort((a,b) => b.total - a.total); }

function chartCard(r){
  const t = todayISO(), span = daysBetween(r.from, r.to) + 1;
  if (span <= 45){
    const days = []; for (let i = 0; i < span; i++) days.push(addDays(r.from, i));
    const exp = db.entries.filter(e => e.type === 'expense' && inR(e, r));
    const vals = days.map(d => sum(exp.filter(e => e.date === d))), max = Math.max(...vals, 1), top = Math.max(...vals);
    const step = Math.ceil(span / 7);
    return `<section class="card"><div class="card-h"><h2>Day by day</h2><span class="dim" style="font-size:13px">Tap a day</span></div>
      <div class="cols" style="grid-template-columns:repeat(${span},1fr);gap:2px">${days.map((d,i) => `<button class="col ${d === t ? 'cur' : ''}" data-drill="day" data-k="${d}" aria-label="${dayLabel(d)}: ${rs(vals[i])}"><div class="col-area" style="height:90px"><div class="col-bar ${d > t ? 'mute' : ''}" style="width:78%;height:${vals[i] / max * 100}%"></div></div><div class="col-l">${i % step === 0 ? +d.slice(8) : ''}</div></button>`).join('')}</div>
      <p class="note">${top ? `Biggest day: ${dayLabel(days[vals.indexOf(top)])}, ${rs(top)}` : 'No spending yet.'}</p></section>`;
  }
  const end = r.to.slice(0,7), ms = []; for (let i = 5; i >= 0; i--) ms.push(shiftMonth(end, -i));
  const d = ms.map(m => totals(monthRange(m))), max = Math.max(...d.map(x => Math.max(x.spent, x.income)), 1);
  return `<section class="card"><div class="card-h"><h2>Month by month</h2><span class="dim" style="font-size:13px">Tap a month</span></div>
    <div class="cols" style="grid-template-columns:repeat(6,1fr)">${ms.map((m,i) => `<button class="col" data-gomonth="${m}"><div class="col-v num">${d[i].spent ? short(d[i].spent) : ''}</div><div class="col-area"><div class="col-bar" style="width:34%;height:${d[i].spent / max * 100}%"></div><div class="col-bar inc" style="width:34%;height:${d[i].income / max * 100}%"></div></div><div class="col-l">${monthLabel(m,true)}</div></button>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Spent</span><span><i style="background:var(--track)"></i>Income</span></div></section>`;
}
function rateCard(){
  const cur = todayISO().slice(0,7), ms = []; for (let i = 5; i >= 0; i--) ms.push(shiftMonth(cur, -i));
  const d = ms.map(m => { const t = totals(monthRange(m)); return {m, inc:t.income, kept:t.income - t.spent, r: t.income ? (t.income - t.spent) / t.income : null}; });
  if (d.every(x => x.r === null)) return `<section class="card"><h2>Savings rate</h2><p class="empty">Log your salary as Income to see how much of it you keep each month.</p></section>`;

    <div class="cols" style="grid-template-columns:repeat(6,1fr);margin-top:12px">${d.map(x => `<div class="col ${x === last ? 'cur' : ''}"><div class="col-v num ${x.r < 0 ? 'neg' : ''}">${x.r === null ? '' : pct(x.r)}</div><div class="col-area" style="height:70px"><div class="col-bar" style="${x.r !== null && x.r < 0 ? 'background:var(--neg);' : ''}height:${x.r === null ? 0 : Math.max(3, Math.abs(x.r) / maxR * 100)}%"></div></div><div class="col-l">${monthLabel(x.m,true)}</div></div>`).join('')}</div></section>`;
}

function loanBalances(){
  const ppl = {};
  for (const e of db.entries.filter(e => groupOf(e.type) === 'loan')){
    const name = (e.person || 'Unknown').trim(), key = name.toLowerCase() + '|' + (e.exclude ? 1 : 0);
    const v = ppl[key] = ppl[key] || {name, excl: !!e.exclude, they:0, me:0};
    if (e.type === 'lent') v.they += +e.amount; if (e.type === 'lent_back') v.they -= +e.amount;
    if (e.type === 'borrowed') v.me += +e.amount; if (e.type === 'borrowed_back') v.me -= +e.amount;
  }
  return Object.values(ppl);
}
function stillOwed(type, person, excl, skipId){
  const name = String(person || '').trim().toLowerCase(); if (!name) return null;
  const lent = type === 'lent_back' || type === 'lent'; let n = 0;
  for (const e of db.entries){
    if (e.id === skipId || (e.person || '').trim().toLowerCase() !== name || !!e.exclude !== !!excl) continue;
    if (lent){ if (e.type === 'lent') n += +e.amount; if (e.type === 'lent_back') n -= +e.amount; }
    else { if (e.type === 'borrowed') n += +e.amount; if (e.type === 'borrowed_back') n -= +e.amount; }
  }
  return n;
}
function viewLoans(){

function viewBills(){
  const m = state.month; let due = 0, paid = 0;
  const rows = db.fixed.map(f => {
    const p = paidIn(f, m), d = isDue(f, m);
    if (d || p) due += +f.amount || 0;
    if (p) paid += sum(db.entries.filter(e => e.fixedId === f.id && monthOf(e.date) === m));
    const status = p ? '<span class="paid">Paid ✓</span>' : d ? `<button class="pay" data-pay="${f.id}">Pay</button>` : '<span class="dim" style="font-size:13px">Not this month</span>';
    return `<div class="fixed-row"><span class="ico sm" style="--h:262">📅</span><div class="row-main tap" data-fixed="${f.id}"><div class="row-title">${esc(f.name)}${f.every === 2 ? '<span class="tag">every 2 months</span>' : ''}</div><div class="row-sub num">${f.amount ? rs(f.amount) : 'Tap to set amount'}</div></div>${status}</div>`;

function suggestions(){

function saveDraft(){
  const d = draft, g = groupOf(d.type), amt = parseAmt(d.amount);
  if (!(amt > 0)) return toast('Enter an amount');
  if (g === 'loan' && !String(d.person||'').trim()) return toast('Add the person’s name');
  if (g === 'expense' && !String(d.item||'').trim()) return toast('Add what it was');
  let share = amt;
  if (g === 'expense' && d.helped){
    const cov = parseAmt(d.covered);
    if (!String(d.coveredBy||'').trim()) return toast('Add who paid');
    if (!(cov > 0)) return toast('Enter how much they paid');
    if (cov > amt) return toast('They can’t pay more than the bill');
    share = amt - cov;
  }
  if (d.type === 'lent_back' || d.type === 'borrowed_back'){ const left = stillOwed(d.type, d.person, d.exclude, d._id); if (left !== null && amt > left + 0.5 && !confirm(`That’s more than the ${rs(Math.max(0,left))} owed. Save anyway?`)) return; }
  const e = {id: d._id || uid(), type: d.type, date: d.date || todayISO(), amount: share, item: String(d.item||'').trim(), created: d.created || Date.now(), updated: Date.now()};
  if (g === 'expense'){ e.category = d.category || guessCat(e.item) || 'Other'; e.method = d.method || ''; }
  if ((g === 'income' || g === 'loan') && d.method) e.method = d.method;
  if (g === 'savings') e.place = d.place || 'Cash';
  if (g === 'loan') e.person = String(d.person).trim();
  if ((g === 'savings' || g === 'loan') && d.exclude) e.exclude = true;
  if (d.opening) e.opening = true;
  if (d.fixedId && g === 'expense') e.fixedId = d.fixedId;
  if (g === 'expense' && d.helped) Object.assign(e, {bill: amt, covered: parseAmt(d.covered), coveredBy: String(d.coveredBy).trim()});
  if (d.reminderId) e.reminderId = d.reminderId;
  if (g === 'savings'){ if (d.moveFrom && d.type === 'save_in') e.moveFrom = d.moveFrom; if (d.child && String(e.place).startsWith('Children’s fund')) e.child = d.child; }
  const i = db.entries.findIndex(x => x.id === e.id);
  if (i >= 0) db.entries[i] = e; else db.entries.push(e);
  save(); markDirty(e.id); closeSheet(); render(); queueSync();
  toast(d._id ? 'Updated' : `Saved ${rs(share)}${g === 'expense' ? ' · ' + e.category : ''}`);
}

  $('#sheetBody').innerHTML = head(d._id ? 'Edit monthly bill' : 'New monthly bill', '<button class="link" data-savefixed>Save</button>') + `
  <div class="field"><label for="fname">Name</label><input class="input" id="fname" data-f="name" value="${esc(d.name)}" placeholder="e.g. Mustafa’s school fees"></div>
  <div class="amount-in"><span class="num">Rs</span><input class="num" data-f="amount" inputmode="decimal" placeholder="0" value="${esc(d.amount || '')}" aria-label="Amount"></div>
  <div class="field"><label>How often</label><div class="seg"><button class="${d.every !== 2 ? 'on' : ''}" data-every="1">Every month</button><button class="${d.every === 2 ? 'on' : ''}" data-every="2">Every 2 months</button></div></div>
  <button class="btn primary" data-savefixed>Save</button>${d._id ? '<button class="btn danger" data-delfixed>Remove this bill</button>' : ''}`;
}
function saveFixed(){
  const d = draft; if (!String(d.name||'').trim()) return toast('Add a name');
  const f = {id: d._id || uid(), name: String(d.name).trim(), amount: parseAmt(d.amount) || 0, every: d.every === 2 ? 2 : 1};
  const i = db.fixed.findIndex(x => x.id === f.id); if (i >= 0) db.fixed[i] = f; else db.fixed.push(f);
  touchState(); save(); closeSheet(); render(); queueSync(); toast('Saved');
}
function payAll(){
  const m = state.month, t = todayISO(), list = db.fixed.filter(f => +f.amount && isDue(f, m) && !paidIn(f, m));
  if (!list.length || !confirm(`Mark ${list.length} bills as paid (${rs(list.reduce((a,f) => a + +f.amount, 0))}) by account transfer? You can edit each one afterwards.`)) return;
  const date = monthOf(t) === m ? t : m + '-01';
  list.forEach((f,i) => { const e = {id:uid() + i, type:'expense', date, amount:+f.amount, item:f.name, category:'Fixed monthly', method:'Account transfer', fixedId:f.id, created:Date.now() + i, updated:Date.now()}; db.entries.push(e); markDirty(e.id); });
  save(); render(); queueSync(); toast(list.length + ' bills marked paid');
}

/* ---- Backup ---- */
async function shareFile(name, text, type){
  const blob = new Blob([text], {type});
  try { const file = new File([blob], name, {type}); if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; } } catch(e){ if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
}
async function backup(){ if (await shareFile('ledger-backup-' + todayISO() + '.json', JSON.stringify({...db, exported:Date.now()}, null, 1), 'application/json')){ db.lastBackup = Date.now(); save(); toast('Backup ready'); } }
async function exportCSV(){
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const lines = [['Date','Type','Item','Amount (Rs)','Category','Paid with / account','Savings place','Person'].join(',')];
  [...db.entries].sort((a,b) => a.date.localeCompare(b.date)).forEach(e => lines.push([e.date, TYPE_LABEL[e.type], e.item, e.amount, e.category, e.method, e.place, e.person].map(q).join(',')));
  await shareFile('ledger-' + todayISO() + '.csv', lines.join('\n'), 'text/csv');
}
function restore(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result); if (!d || !Array.isArray(d.entries)) throw new Error();
      const ids = new Set(db.entries.map(e => e.id)); let added = 0;
      for (const e of d.entries){ if (e && e.id && e.type && e.date && !ids.has(e.id)){ db.entries.push(e); markDirty(e.id); added++; } }
      if (Array.isArray(d.fixed)) for (const f of d.fixed){
        const same = db.fixed.find(x => x.id === f.id) || db.fixed.find(x => x.name.toLowerCase() === String(f.name).toLowerCase());
        if (same){ db.entries.forEach(e => { if (e.fixedId === same.id) e.fixedId = f.id; }); Object.assign(same, f); } else db.fixed.push(f);
      }
      if (Array.isArray(d.reminders)) for (const x of d.reminders){ if (x && x.id && !db.reminders.some(y => y.id === x.id)) db.reminders.push(x); }
      if (d.budgets) for (const k in d.budgets){ if (!db.budgets[k]) db.budgets[k] = d.budgets[k]; }
      if (d.kids && !db.kids) db.kids = d.kids;
      if (d.seededV4) db.seededV4 = true;
      touchState(); migrate(); save(); closeSheet(); render(); queueSync(); toast(added + ' entries restored');
    } catch(e){ toast('That file isn’t a ledger backup'); }
  };
  r.readAsText(file);
}

/* =================== Events =================== */
function setPeriod(p){ state.period = p; try { localStorage.setItem('hibba-ledger-ui', JSON.stringify({period:state.period, from:state.from, to:state.to})); } catch(e){} }
document.addEventListener('click', ev => {
  const el = ev.target.closest('button,[data-fixed],[data-close],[data-rem]'); if (!el) return;
  const ds = el.dataset;
  if ('close' in ds) return closeSheet();
  if (ds.tab){ closeSheet(); state.tab = ds.tab; window.scrollTo(0,0); return render(); }
  if (el.id === 'fab' || el.id === 'fab2'){ const t = state.tab === 'money' ? ({loans:'lent', savings:'save_in'}[state.money] || 'expense') : 'expense'; return openEntry({type:t}); }
  if (ds.month){ if (state.period !== 'month' && state.tab !== 'money') setPeriod('month'); state.month = shiftMonth(state.month, +ds.month); return render(); }
  if ('period' in ds) return openPeriod();
  if (ds.setperiod){ if (ds.setperiod === 'custom'){ $('#custom').style.display = 'block'; return; } setPeriod(ds.setperiod); if (ds.setperiod === 'month') state.month = todayISO().slice(0,7); closeSheet(); return render(); }
  if ('applycustom' in ds){ const f = $('#cFrom').value, t = $('#cTo').value; if (!f || !t || f > t) return toast('Pick a start before the end'); state.from = f; state.to = t; setPeriod('custom'); closeSheet(); return render(); }
  if (ds.gomonth){ setPeriod('month'); state.month = ds.gomonth; return render(); }
  if (ds.drill) return drill(ds.drill, ds.k);
  if (ds.filter){ state.filter = ds.filter; return render(); }
  if (ds.money){ state.money = ds.money; return render(); }
  if (ds.edit) return openEntry({}, ds.edit);
  if (ds.quick){ const e = db.entries.find(x => x.id === ds.quick); return openEntry({item:e.item, category:e.category, method:e.method, amount:e.amount}); }
  if (ds.open){ const o = ds.open; return o === 'settings' ? openSettings() : o === 'budgets' ? openBudgets() : o === 'attention' ? openAttention() : null; }
  if ('opensheet' in ds){ if (sync.sheetUrl) window.open(sync.sheetUrl, '_blank'); else { toast('Connect your Google Sheet first'); openSettings(); } return; }
  if ('addsave' in ds) return openEntry({type:'save_in'});
  if ('addloan' in ds) return openEntry({type:'lent'});
  if ('gobills' in ds){ closeSheet(); state.tab = 'money'; state.money = 'bills'; return render(); }
  if ('payall' in ds) return payAll();
  if (ds.key){
    let a = draft.amount || '';
    if (ds.key === '⌫') a = a.slice(0, -1);
    else if (ds.key === '.'){ if (!a.includes('.')) a = (a || '0') + '.'; }
    else if (a.replace('.','').length < 10 && !(a.includes('.') && a.split('.')[1].length >= 2)) a = a === '0' ? ds.key : a + ds.key;
    draft.amount = a; return paintAmount();
  }
  if (ds.group){ draft.type = {expense:'expense', income:'income', savings:'save_in', loan:'lent'}[ds.group]; return renderEntry(); }
  if (ds.type){ draft.type = ds.type; return renderEntry(); }
  if (ds.set){ draft[ds.set] = ds.val; if (ds.set === 'category') draft._catTouched = true; return sheetMode === 'rem' ? renderRem() : renderEntry(); }
  if (ds.sugg){
    if (ds.sugg === '_salary'){ draft.item = 'Salary'; return renderEntry(); }
    const e = db.entries.find(x => x.id === ds.sugg); if (!e) return;
    draft.item = e.item;
    if (e.category){ draft.category = e.category; draft._catTouched = true; }
    if (e.method) draft.method = e.method;
    if (!parseAmt(draft.amount)) draft.amount = String(e.amount);
    return renderEntry();
  }
  if (ds.setp !== undefined){ draft.person = ds.setp; return renderEntry(); }
  if (ds.setcby !== undefined){ draft.coveredBy = ds.setcby; return renderEntry(); }
  if (ds.date){ draft.date = ds.date; return renderEntry(); }
  if (ds.helped){ draft.helped = ds.helped === '1'; return renderEntry(); }
  if (ds.excl){ draft.exclude = ds.excl === '1'; return sheetMode === 'rem' ? renderRem() : renderEntry(); }
  if ('save' in ds) return saveDraft();
  if ('delete' in ds){ if (confirm('Delete this entry?')){ const id = draft._id; db.entries = db.entries.filter(e => e.id !== id); save(); markDeleted(id); closeSheet(); render(); queueSync(); toast('Deleted'); } return; }
  if (ds.settle) return openEntry({type:ds.settle, person:ds.person, amount:ds.amt, exclude:ds.x === '1', item: ds.settle === 'lent_back' ? 'Money received back' : 'Loan repayment', method:''});
  if (ds.rempay) return payRem(ds.rempay);
  if (ds.rem) return openRem(ds.rem);
  if ('newrem' in ds) return openRem(null);
  if (ds.remkind){ draft.kind = ds.remkind; return renderRem(); }
  if ('saverem' in ds) return saveRem();
  if ('delrem' in ds){ if (confirm('Remove this reminder? Payments you logged stay.')){ db.reminders = db.reminders.filter(r => r.id !== draft._id); touchState(); save(); closeSheet(); render(); queueSync(); } return; }
  if (ds.kidadd) return openEntry({type:'save_in', place:KIDS_MAMA, exclude:true, child:ds.kidadd, item:'Deposit for ' + ds.kidadd});
  if (ds.pay){ const f = db.fixed.find(x => x.id === ds.pay), t = todayISO(); return openEntry({type:'expense', category:'Fixed monthly', item:f.name, amount:f.amount || '', fixedId:f.id, date: monthOf(t) === state.month ? t : state.month + '-01'}); }
  if (ds.fixed) return openFixed(ds.fixed);
  if ('newfixed' in ds) return openFixed(null);
  if (ds.every){ draft.every = +ds.every; return renderFixed(); }
  if ('savefixed' in ds) return saveFixed();
  if ('delfixed' in ds){ if (confirm('Remove this bill? Past payments stay.')){ db.fixed = db.fixed.filter(f => f.id !== draft._id); touchState(); save(); closeSheet(); render(); queueSync(); } return; }
  if ('savebudgets' in ds){ const b = {}; document.querySelectorAll('[data-bcat]').forEach(i => { const v = parseAmt(i.value); if (v > 0) b[i.dataset.bcat] = v; }); db.budgets = b; touchState(); save(); closeSheet(); render(); queueSync(); return toast('Budgets saved'); }
  if (ds.att !== undefined){
    const x = attention()[+ds.att]; closeSheet(); if (!x) return;
    if (x.edit) return openEntry({}, x.edit); if (x.drill) return drill('cat', x.drill); if (x.fixed) return openFixed(x.fixed);
    if (x.go){ state.tab = 'money'; state.money = x.go; return render(); } if (x.income) return openEntry({type:'income', item:'Salary'});
  }
  if ('connect' in ds){
    const url = $('#sUrl').value.trim(), key = $('#sKey').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Paste the web app link from Apps Script');
    if (!key) return toast('Paste the app key');
    const first = !connected() || sync.url !== url || sync.key !== key;
    sync.url = url; sync.key = key; sync.error = '';
    if (first){ sync.outbox = db.entries.map(e => e.id); sync.stateDirty = true; if (!db.stateUpdated) db.stateUpdated = Date.now(); }
    saveSync(); closeSheet(); toast(first ? 'Uploading your ledger…' : 'Syncing…');
    return syncNow(true, true);
  }
  if ('disconnect' in ds){ if (confirm('Stop syncing with the sheet? Your data stays on this phone and in the sheet.')){ sync = blankSync(); saveSync(); closeSheet(); render(); } return; }
  if ('backup' in ds) return backup();
  if ('csv' in ds) return exportCSV();
  if ('restore' in ds) return $('#restoreFile').click();
  if ('erase' in ds){
    if (confirm('Erase every entry on this phone? ' + (connected() ? 'Your Google Sheet keeps its copy, and syncing will be turned off.' : 'Back up first if you might need them.')) && confirm('This can’t be undone. Erase now?')){
      db = {v:1, entries:[], fixed:defaultFixed(), lastBackup:0, reminders:[], budgets:{}}; sync = blankSync(); saveSync(); save(); closeSheet(); render(); toast('Erased');
    }
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'search'){ state.q = t.value; $('#actBody').innerHTML = activityBody(); return; }
  const f = t.dataset && t.dataset.f; if (!f || !draft) return;
  draft[f] = t.value;
  if (sheetMode === 'entry'){
    if (f === 'item' && $('#sugg')) $('#sugg').innerHTML = suggestions();
    if (f === 'covered' || f === 'person') $('#amtH').innerHTML = amtHint();
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (sheetMode === 'entry' && t.id === 'item' && draft && draft.type === 'expense' && !draft._catTouched){ const c = guessCat(t.value); if (c){ draft.category = c; document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.val === c)); } }
  if (sheetMode === 'entry' && t.dataset.f === 'date') renderEntry();
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') return closeSheet();
  if (sheetMode === 'entry' && ev.target.tagName !== 'INPUT'){
    if (/^[0-9.]$/.test(ev.key)) document.querySelector(`[data-key="${ev.key}"]`)?.click();
    if (ev.key === 'Backspace') document.querySelector('[data-key="⌫"]')?.click();
    if (ev.key === 'Enter') saveDraft();
  }
  if (ev.key === 'Enter' && ev.target.id === 'item') ev.target.blur();
});
$('#restoreFile').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) restore(f); ev.target.value = ''; });
window.addEventListener('online', () => { paintSync(); syncNow(true); });
window.addEventListener('offline', paintSync);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ if (!sheetMode) render(); syncNow(true); } });

migrate();
render();
syncNow(true);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
